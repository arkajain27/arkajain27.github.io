<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Message sent | Arka Jain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14; --surface: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.10); --text: #e8eaf0;
    --muted: #9aa3b5; --brass: #f5b04c; --link: #8ab4f8; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, sans-serif; line-height: 1.65;
    min-height: 100vh; display: grid; place-items: center;
    background-image:
      radial-gradient(60rem 30rem at 85% -10%, rgba(245,176,76,0.13), transparent 60%),
      radial-gradient(50rem 28rem at -10% 25%, rgba(96,125,255,0.10), transparent 60%);
    background-repeat: no-repeat;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 2rem 2.4rem; margin: 1.4rem;
    max-width: 26rem; text-align: center;
  }
  h1 {
    font-family: "Space Grotesk", Inter, sans-serif;
    font-size: 1.6rem; margin: 0 0 0.5rem; letter-spacing: -0.01em;
  }
  p { color: var(--muted); margin: 0 0 1.2rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>Message sent</h1>
    <p>Thanks for writing &mdash; it goes straight to me, and I read
    everything that comes in.</p>
    <a href="https://arkajain.com/">&larr; Back to arkajain.com</a>
  </div>
</body>
</html>
